version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns:
          ['eslint*', 'prettier*', '@typescript-eslint/*', '@playwright/*', 'wrangler']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
