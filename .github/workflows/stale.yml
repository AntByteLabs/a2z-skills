name: Stale posts

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  stale:
    name: List posts due for re-testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Collect overdue posts
        id: stale
        run: |
          npx tsx scripts/stale-posts.ts --json > stale.json
          echo "count=$(node -e "console.log(require('./stale.json').length)")" >> "$GITHUB_OUTPUT"

      - name: Open one issue for the batch
        if: steps.stale.outputs.count != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const rows = require('./stale.json');
            const week = new Date().toISOString().slice(0, 10);
            const body = [
              `${rows.length} post(s) are past their re-test date.`,
              '',
              '| Post | Type | Last tested | Days overdue | Versions tested |',
              '| --- | --- | --- | --- | --- |',
              ...rows.map((r) =>
                `| [/${r.slug}/](https://a2zskillsewa.com/${r.slug}/) | ${r.type} | ${r.testedOn ?? 'never'} | ${r.daysOverdue} | ${Object.entries(r.versions).map(([k, v]) => `${k} ${v}`).join(', ') || '—'} |`,
              ),
              '',
              'Re-test on current versions. If nothing changed, update `testedOn.date`',
              'and leave `updatedAt` alone. If the steps changed, update both.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Re-test ${rows.length} post(s) — week of ${week}`,
              body,
              labels: ['re-test', 'content'],
            });
