name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # validate-content.ts compares slugs against the previous commit.
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck the worker
        run: npm run check:worker

      - name: Validate content
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run links

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  design-gates:
    name: Design and prose gates
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    # Advisory: these report, they do not block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Hallmark sloplint
        run: |
          npx -y skills add nutlope/hallmark --agent claude-code
          node ~/.claude/skills/hallmark/scripts/sloplint.mjs dist/index.html dist/excel-xlookup-not-working/index.html || true
      - name: Impeccable detectors
        run: npx -y impeccable@latest check dist || true

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm test

  preview:
    name: Preview deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    # Secrets are not available to forks, so this step is skipped there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Upload a preview version
        id: upload
        # The exit code must come from wrangler, not from the last echo in the
        # pipeline, or a failed upload reports the job as green.
        run: |
          set -o pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set, so no preview can be uploaded."
            exit 1
          fi
          out=$(npx wrangler versions upload --message "PR #${{ github.event.pull_request.number }}" 2>&1 | tee /dev/stderr)
          url=$(printf '%s' "$out" | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler uploaded no preview URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment the preview URL
        if: steps.upload.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            **Preview:** ${{ steps.upload.outputs.url }}

            Read one post on a phone before merging. Check the short answer, the
            tested-on box and that nothing shifts while the page loads.
