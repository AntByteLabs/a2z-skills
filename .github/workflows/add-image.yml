name: Add a hero image

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Post slug, e.g. excel-xlookup-not-working
        required: true
      url:
        description: Public https URL of the image
        required: true
      alt:
        description: What the image shows (not "image of…")
        required: true
      name:
        description: File name without extension
        required: false
        default: hero

permissions:
  contents: write
  pull-requests: write

jobs:
  add:
    name: Download, re-encode and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Fetch and re-encode the image
        run: |
          npx tsx scripts/add-image.ts \
            "${{ inputs.slug }}" \
            "${{ inputs.url }}" \
            "${{ inputs.alt }}" \
            --name "${{ inputs.name }}"

      - name: Make sure the post still builds
        run: npm run build
        env:
          INCLUDE_DRAFTS: '1'

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: image/${{ inputs.slug }}-${{ inputs.name }}
          delete-branch: true
          title: 'Add ${{ inputs.name }} image to ${{ inputs.slug }}'
          commit-message: |
            Add ${{ inputs.name }} image to ${{ inputs.slug }}

            Fetched from a public URL, re-encoded to WebP at 1600px and
            stripped of metadata by scripts/add-image.ts.
          body: |
            Adds `${{ inputs.name }}.webp` to `src/content/posts/${{ inputs.slug }}/`.

            - **Alt text:** ${{ inputs.alt }}
            - **Source:** ${{ inputs.url }}

            Check before merging:

            - [ ] The alt text describes what the image shows.
            - [ ] The image is the writer's own, generated, or licensed for use.
            - [ ] It adds something the prose does not already say.
          labels: image, content
